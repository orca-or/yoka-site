<!DOCTYPE html>

<html lang="pt">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Criar conta - Yoka</title>

<link
    rel="stylesheet"
    href="./css/style.css"
>

<link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
</head>


    <style>

    .form-group label {
        color: #333;
    }



    </style>
<body>


<main class="login-container">

    <section class="login-card">

        <div class="login-header">

      <h1><a href="index.html" style="color: black;text-decoration: none;">Yoka</a></h1>


            <p>
                Crie a sua conta
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Nome
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Digite o seu nome"
                    autocomplete="name"
                    required
                    minlength="2"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite o seu email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                    minlength="8"
                >

            </div>

<div
    style="
        display: block;
        width: 100%;
        margin-top: 18px;
        margin-bottom: 20px;
        color: #333;
        font-size: 14px;
        line-height: 1.5;
    "
>

    <label
        for="acceptTerms"
        style="
            display: flex;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            cursor: pointer;
        "
    >

        <input
            type="checkbox"
            id="acceptTerms"
            name="acceptTerms"
            required
            style="
                width: 16px;
                height: 16px;
                min-width: 16px;
                margin: 3px 0 0 0;
                padding: 0;
                cursor: pointer;
                opacity: 1;
                visibility: visible;
                display: block;
            "
        >

        <span
            style="
                display: block;
                color: #333;
                visibility: visible;
                opacity: 1;
            "
        >
            Li e concordo com os
            <a
                href="termos.html"
                target="_blank"
                rel="noopener noreferrer"
                style="color: inherit; text-decoration: underline;"
            >
                Termos e Condições
            </a>
            e a
            <a
                href="privacidade.html"
                target="_blank"
                rel="noopener noreferrer"
                style="color: inherit; text-decoration: underline;"
            >
                Política de Privacidade
            </a>.
        </span>

    </label>

</div>


            <button
                type="submit"
                class="btn-login"
            >
                Criar conta
            </button>


            <div
                id="registerMensagem"
                class="login-mensagem"
                style="display:none;"
            ></div>

        </form>


        <div class="login-footer">

            <p>
                Já tem uma conta?
            </p>

            <a href="login.html">
                Entrar
            </a>

        </div>



    </section>

</main>


<script src="js/api.js"></script>

<script src="js/auth.js"></script>


</body>

</html>
