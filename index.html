/* =========================================================
   YOKA — SLIDERS RESPONSIVOS DE PUBLICIDADE
========================================================= */

.yoka-index-ads {
    position: fixed;
    top: 90px;
    right: 20px;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    z-index: 999;
    box-sizing: border-box;
}

.yoka-index-ads-title {
    margin: 0;
    color:white;
    font-size: 16px;
}

.yoka-index-ad {
    width: 100%;
    aspect-ratio: 6 / 5;
    position: relative;
    overflow: hidden;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 4px 18px rgba(0, 0, 0, .12);
    box-sizing: border-box;
    
}

.yoka-ad-slider {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
    background: #fff;
}

.yoka-ad-slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;

    opacity: 0;
    visibility: hidden;
    z-index: 0;
    pointer-events: none;

    transition:
        opacity 1.2s ease-in-out,
        visibility 1.2s ease-in-out;
}

.yoka-ad-slide.active {
    opacity: 1;
    visibility: visible;
    z-index: 1;
    pointer-events: auto;
}


/* Ocultar o slider até recuperar a imagem guardada */
.yoka-ad-slider:not(.yoka-ad-slider-ready) {
    visibility: hidden;
}

/* Evitar transições durante a inicialização */
.yoka-ad-slider:not(.yoka-ad-slider-ready) .yoka-ad-slide {
    transition: none !important;
}











.yoka-ad-slide img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

.yoka-ad-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 32px;
    height: 40px;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: rgba(0, 0, 0, .55);
    color: #fff;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
    opacity: .85;
}

.yoka-ad-arrow:hover {
    background: rgba(0, 0, 0, .8);
}

.yoka-ad-arrow.prev {
    left: 6px;
}

.yoka-ad-arrow.next {
    right: 6px;
}

.yoka-ad-dots {
    position: absolute;
    bottom: 8px;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    justify-content: center;
    gap: 7px;
}

.yoka-ad-dot {
    width: 8px;
    height: 8px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, .35);
    cursor: pointer;
}

.yoka-ad-dot.active {
    background: #fff;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .35);
}

/* Mostrar setas ao passar o rato; mantê-las acessíveis ao toque */
@media (hover: hover) and (pointer: fine) {
    .yoka-ad-arrow {
        opacity: 0;
        transition: opacity .2s ease;
