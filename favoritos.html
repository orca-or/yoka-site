<title>Favoritos - Yoka</title>

    rel="stylesheet"
    href="css/style.css"
>
<link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">

<link

>

<style>

    /* =========================================================
   YOKA — HEADER COM PESQUISA NO TOPO EM TODOS OS ECRÃS
   ========================================================= */

@media (max-width: 700px) {
    .header-inner {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        flex-wrap: nowrap;
        width: 100%;
        box-sizing: border-box;
        padding-left: 8px;
        padding-right: 8px;
    }

    .logo {
        order: initial;
        font-size: 20px;
        white-space: nowrap;
    }

    .header-search {
        order: initial;
        display: flex;
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: none;
        margin: 0;
    }

    .header-search input {
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        height: 36px;
        padding: 0 8px;
        font-size: 12px;
    }

    .header-search button {
        flex: 0 0 34px;
        width: 34px;
        height: 36px;
        font-size: 14px;
    }

    .header-user {
        order: initial;
        display: flex;
        flex-shrink: 0;
        min-width: 0;
        gap: 3px;
        margin: 0;
    }

    .notification-container {
        flex-shrink: 0;
        margin-right: 0;
    }

    .notification-button,
    .user-avatar-button {
        width: 32px;
        height: 32px;
    }

    .favorite-button {
        display: none;
    }
}

@media (max-width: 360px) {
    .header-inner {
        gap: 5px;
        padding-left: 5px;
        padding-right: 5px;
    }

    .logo {
        font-size: 18px;
    }

    .header-search input {
        padding: 0 5px;
        font-size: 11px;
    }

    .header-search button {
        flex-basis: 30px;
        width: 30px;
    }

    .header-user {
        gap: 2px;
    }

    .notification-button,
    .user-avatar-button {
        width: 29px;
        height: 29px;
    }
}

/* Manter favoritos visível no cabeçalho mobile */
@media (max-width: 700px) {
    .favorite-button {
        display: flex !important;
        flex-shrink: 0;
    }

    .header-user {
        gap: 3px;
    }

    .notification-container {
        margin-right: 0;
    }
}


.favorite-song-cover {
    position: relative;
}

.favorite-song-genre {
    position: absolute;
    top: 6px;
    right: 6px;
    left: auto;

    width: fit-content;
    max-width: 70%;
    box-sizing: border-box;

    padding: 4px 8px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;

    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    border-radius: 4px;

    font-size: 18px;
    line-height: 1.2;
    z-index: 5;
}



</style>
<body>


<header class="site-header">

<div class="header-inner">

    <a
        href="./index.html"
        class="logo"
    >
        Yoka
    </a>

<button
    type="button"
    id="toggleHeaderSearch"
    class="toggle-header-search"
    aria-label="Abrir pesquisa"
    aria-expanded="false"
>
    <span aria-hidden="true">⌕</span>
</button>
    <!-- PESQUISA -->

    <div class="header-search">

        <input
            type="search"
            id="searchInput"
            placeholder="Pesquisar músicas ou artistas"
            autocomplete="off"
        >

        <button
            id="searchButton"
            type="button"
            aria-label="Pesquisar"
        >
            🔍
        </button>

    </div>


    <!-- UTILIZADOR -->
<div id="headerUser" class="header-user">

    <!-- NOTIFICAÇÕES -->
    <div id="notificationContainer" class="notification-container">

<a
    href="./favoritos.html"
    class="notification-button favorite-button"
    aria-label="Favoritos"
    title="Favoritos"
>
    <svg
        class="favorite-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
    >
        <path
            d="M12 2.5l2.95 5.98 6.6.96-4.77 4.65 1.13 6.57L12 17.56l-5.91 3.1 1.13-6.57-4.77-4.65 6.6-.96L12 2.5z"
        />
    </svg>
</a>
        <button
            id="notificationButton"
            class="notification-button"
            type="button"
            aria-label="Notificações"
        >
            🔔
            <span
                id="notificationBadge"
                class="notification-badge hidden"
            >
                0
            </span>
        </button>

        <div
            id="notificationDropdown"
            class="notification-dropdown hidden"
        >

            <div class="notification-header">
                <strong>Notificações</strong>

                <button
                    id="markAllNotificationsRead"
                    type="button"
                >
                    Marcar todas como lidas
                </button>
            </div>

            <div
                id="notificationList"
                class="notification-list"
            >
                <div class="notification-empty">
                    Carregando notificações...
                </div>
            </div>

        </div>

    </div>


    <!-- UTILIZADOR -->

 <a
    href="./login.html"
    id="loginButton"
    class="login-button hidden"
>
    Entrar
</a>

<a
    href="./register.html"
    id="registerButton"
    class="login-button hidden"
>
    Criar conta
</a>
    
    <div
        id="userMenu"
        class="user-menu hidden"
    >

        <button
            id="userAvatarButton"
            class="user-avatar-button"
            type="button"
            aria-label="Abrir menu do utilizador"
        >
            <img
                id="headerAvatar"
                class="header-avatar"
                src="./assets/images/default-avatar.svg"
                alt="Perfil"
            >
        </button>

        <div
            id="userDropdown"
            class="user-dropdown hidden"
        >

            <a
    href="#"
    id="profileMenuLink"
    class="user-dropdown-item"
>
    Perfil
</a>

            <button
                id="logoutButton"
                class="user-dropdown-item logout-item"
                type="button"
            >
                Sair
            </button>

        </div>

    </div>

</div>

</header>


<main class="favorites-page">


<section class="favorites-container">

    <div class="favorites-header">

        <h1>
          Minhas músicas favoritas
        </h1>

        <span
            id="favoritesCount"
            class="favorites-count"
        >
            0 músicas
        </span>

    </div>


    <div
        id="favoritesLoading"
        class="song-message"
    >
        Carregando favoritos...
    </div>


    <div
        id="favoritesError"
        class="song-message"
        style="display:none;"
    ></div>


    <div
        id="favoritesEmpty"
        class="song-message"
        style="display:none;"
    >
        Você ainda não adicionou nenhuma música aos favoritos.
    </div>


    <div
        id="favoritesList"
        class="favorites-list"
    ></div>

</section>


</main>

     FOOTER
========================================================= -->

    <!-- RODAPÉ -->
    <footer class="site-footer">
        <div class="footer-inner">

            <p>
                © <span id="currentYear"></span>
                Yoka. Todos os direitos reservados.
            </p>

            <div class="footer-legal">
                <a href="./termos.html">Termos e Condições</a>

                <span class="footer-separator">|</span>

                <a href="./privacidade.html">Política de Privacidade</a>

                <span class="footer-separator">|</span>
