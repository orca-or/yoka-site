<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar palavra-passe - Yoka</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
<link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
</head>
<style>
.form-group label {
   color: #333;
}

.login-mensagem {
   color: red;
}



</style>
<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

             <h1><a href="index.html" style="color: black;text-decoration: none;">Yoka</a></h1>


                <p>
                    Recuperar palavra-passe
                </p>

            </div>


            <form id="recuperarSenhaForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite o seu email"
                        autocomplete="email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login"
                    id="btnRecuperarSenha"
                >
                    Enviar link de recuperação
                </button>


                <div
                    id="recuperarMensagem"
                    class="login-mensagem"
                    style="display:none;"
                ></div>

            </form>


            <div class="login-footer">

                <a href="login.html">
                    Voltar para o login
                </a>

            </div>


        </section>

    </main>


    <script src="js/api.js"></script>

    <script src="js/recuperar-senha.js"></script>

</body>

</html>
