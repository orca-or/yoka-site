<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yoka ADM - Artistas</title>

    <link
        rel="stylesheet"
        href="./artistas.css"
    >

    <link
        rel="stylesheet"
        href="./usuarios.css"
    >

</head>

<body>

    <div class="admin-layout">

        <!-- =================================================
             BARRA LATERAL ADM
        ================================================== -->

        <aside class="admin-sidebar">

            <div class="admin-sidebar-brand">

                <h1>Yoka</h1>

                <span>ADM</span>

            </div>


            <nav class="admin-sidebar-nav">

                <a
                    href="./dashboard.html"
                    class="admin-sidebar-link"
                >
                    <span>Dashboard</span>
                </a>


                <a
                    href="./usuarios.html"
                    class="admin-sidebar-link"
                >
                    <span>Usuários</span>
                </a>


                <a
                    href="./musicas.html"
                    class="admin-sidebar-link"
                >
                    <span>Músicas</span>
                </a>


                <a
                    href="./artistas.html"
                    class="admin-sidebar-link active"
                >
                    <span>Artistas</span>
                </a>


                <a
                    href="./comentarios.html"
                    class="admin-sidebar-link"
                >
                    <span>Comentários</span>
                </a>

                  <a href="./denuncias.html" class="admin-sidebar-link active">
                <span>Denúncias</span>
            </a>
                <a
                    href="./notificacoes.html"
                    class="admin-sidebar-link"
                >
                    <span>Notificações</span>
                </a>

            </nav>


            <div class="admin-sidebar-bottom">

                           <a
    href="#"
    id="adminProfileLink"
    class="admin-sidebar-link"
>
    <span>Voltar ao perfil</span>
</a>

                <button
                    id="logoutButton"
                    type="button"
                    class="admin-sidebar-logout"
                >
                    Sair
                </button>

            </div>

        </aside>


    <!-- =================================================
         ÁREA PRINCIPAL
    ================================================== -->

    <div class="admin-content">


        <!-- HEADER -->

        <header class="admin-header">

       
            <div>

                <h2>Artistas</h2>

                <p>
                    Gerencie os artistas cadastrados na plataforma.
                </p>

            </div>



<div class="admin-global-search">
    <form id="adminSearchForm" role="search">
        <span aria-hidden="true">⌕</span>

        <input
            type="search"
            id="adminSearchInput"
            placeholder="Pesquisar no painel ADM..."
            autocomplete="off"
            aria-label="Pesquisar no painel administrativo"
        >

        <button type="submit">Pesquisar</button>
    </form>

    <div
        id="adminSearchResults"
        class="admin-search-results"
        hidden
        role="status"
    ></div>
</div>

<div class="admin-user">

    <div class="admin-notifications">
        <button
            type="button"
            id="adminNotificationButton"
            class="admin-notification-button"
            aria-label="Abrir notificações"
            aria-expanded="false"
        >
            <span aria-hidden="true">  🔔</span>
            <span
                id="adminNotificationBadge"
                class="admin-notification-badge"
                hidden
            >0</span>
        </button>

        <div
            id="adminNotificationDropdown"
            class="admin-notification-dropdown"
            hidden
        >
            <div class="admin-notification-header">
                <strong>Notificações</strong>
                <button
                    type="button"
                    id="adminMarkAllRead"
                >
                    Marcar todas como lidas
                </button>
            </div>

            <div
                id="adminNotificationList"
                class="admin-notification-list"
                aria-live="polite"
            >
                A carregar notificações...
            </div>
        </div>
    </div>

    <span id="adminName">Administrador</span>

</div>


        </header>



    <main class="admin-main">

        <section class="page-header">

            <button
                type="button"
                id="refreshButton"
                class="refresh-button"
            >
                ↻ Atualizar
            </button>

        </section>


        <section
            id="messageContainer"
            class="message-container"
        ></section>


        <section class="artists-section">

            <div
                id="loadingContainer"
                class="loading-container"
            >
                Carregando artistas...
            </div>


            <div
                id="emptyContainer"
                class="empty-container"
                hidden
            >
                Nenhum artista encontrado.
            </div>


            <div
                id="artistsGrid"
                class="artists-grid"
            ></div>

        </section>

    </main>

>
   >
    <script src="./js/admin-search.js" defer></script>
<script src="./js/admin-notifications.js"></script>
   <script src="./js/artistas.js" ></script>
   <script src="./js/admin-profile.js" defer></script>
</body>

</html>
