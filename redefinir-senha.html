<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Redefinir palavra-passe - Yoka</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
<link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
</head>
<style>
.form-group label {


    color: #333;
    }

    .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    </style>
<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">

                 <h1><a href="index.html" style="color: black;text-decoration: none;">Yoka</a></h1>


                <p>
                    Criar nova palavra-passe
                </p>

            </div>


            <form id="redefinirSenhaForm">

                <div class="form-group">

                    <label for="password">
                        Nova palavra-passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite a nova palavra-passe"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirmar palavra-passe
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Digite novamente a palavra-passe"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login"
                    id="btnRedefinirSenha"
                >
                    Redefinir palavra-passe
                </button>


                <div
                    id="redefinirMensagem"
                    class="login-mensagem"
                    style="display:none;color: red;"
                ></div>

            </form>


            <div class="login-footer">

                <a href="login.html">
                    Voltar para o login
                </a>

            </div>


           
        </section>

    </main>


    <script src="js/api.js"></script>

    <script src="js/redefinir-senha.js"></script>

</body>

</html>
